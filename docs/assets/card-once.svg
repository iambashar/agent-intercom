<svg xmlns="http://www.w3.org/2000/svg" width="600" height="210" viewBox="0 0 600 210" role="img">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1020"/><stop offset="1" stop-color="#161D38"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
  
</defs>
<rect width="600" height="210" rx="20" fill="url(#bg)"/>
<rect width="600" height="210" rx="20" fill="url(#dots)"/>

<rect x="1" y="1" width="598" height="208" rx="20" fill="none" stroke="#19C37D" stroke-opacity="0.45" stroke-width="2"/>
<rect x="32" y="40" width="72" height="72" rx="18" fill="#19C37D" opacity="0.14"/>
<g transform="translate(40,48)"><circle cx="28" cy="28" r="22" fill="none" stroke="#19C37D" stroke-width="4"/><path d="M17 29 L25 37 L40 20" fill="none" stroke="#19C37D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="128" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="800" fill="#E8ECF8">Delivered exactly once</text>
<text x="128" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">Messages are claimed before a push,</text><text x="128" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">so a push and mail_check never both</text><text x="128" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">deliver one. Failures go back to inbox.</text>

</svg>
