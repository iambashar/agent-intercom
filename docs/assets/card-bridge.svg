<text x="128" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">bridge.sh moves mail over SSH, so</text><text x="128" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">agents on a GPU box or HPC cluster</text><text x="128" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#9AA4C7">talk to the ones on your laptop.</text>

