  <text x="125" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9AA4C7">failed? back to inbox, retry</text>
</g>
