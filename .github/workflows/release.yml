name: Release

# Runs when a GitHub release is published:
#  - GitHub Packages: publishes @iambashar/agent-intercom with the built-in GITHUB_TOKEN.
#  - npm: stages agent-intercom through npm trusted publishing (OIDC, no token). The staged version goes
#    live after a maintainer approves it with 2FA: `npm stage list agent-intercom`, then
#    `npm stage approve <id>`, or on npmjs.com.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write # npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  github-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@iambashar'
      # GitHub Packages only accepts names scoped to the repo owner.
      - run: npm pkg set name=@iambashar/agent-intercom
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No registry-url here: setup-node would write a token line into .npmrc, and trusted publishing
      # must authenticate with the workflow's OIDC identity instead.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@12
      - name: Stage on npm
        run: |
          v=$(node -p "require('./package.json').version")
          if npm view "agent-intercom@$v" version >/dev/null 2>&1; then
            echo "agent-intercom@$v is already on npm; skipping"; exit 0
          fi
          npm stage publish . --provenance --access public
          {
            echo "### agent-intercom@$v staged on npm"
            echo "Approve it with 2FA to make it live: \`npm stage list agent-intercom\`, then \`npm stage approve <id>\` (or on npmjs.com)."
          } >> "$GITHUB_STEP_SUMMARY"
