  <text x="115.0" y="70.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9AA4C7">~/.agent-mail/&lt;name&gt;/</text>
</g>
<g transform="translate(590,150)">
