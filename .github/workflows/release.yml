name: Release

# Runs when a GitHub release is published. Publishes the same tarball to:
#  - GitHub Packages as @iambashar/agent-intercom (uses the built-in GITHUB_TOKEN)
#  - npm as agent-intercom, only if the NPM_TOKEN secret is set (a granular token with "bypass 2FA")
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  id-token: write # npm provenance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"

  github-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@iambashar'
      # GitHub Packages only accepts names scoped to the repo owner.
      - run: npm pkg set name=@iambashar/agent-intercom
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "NPM_TOKEN not set; skipping npm (publish by hand)"; exit 0; fi
          if npm view "agent-intercom@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "this version is already on npm; skipping"; exit 0
          fi
          npm publish --provenance --access public
