  <text x="140.0" y="62.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9AA4C7">/tmp/cc-socks/&lt;pid&gt;.sock</text>
</g>
