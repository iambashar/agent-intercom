  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/></pattern>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#9AA4C7"/></marker>
</defs>
<rect width="1280" height="520" rx="24" fill="url(#bg)"/>
<rect width="1280" height="520" rx="24" fill="url(#dots)"/>

<text x="640" y="56" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" fill="#E8ECF8">How live push works</text>
<text x="640" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#9AA4C7">Event-driven: one file-system watcher, no polling, each message delivered exactly once</text>
<g transform="translate(40,200)">
  <rect width="200" height="100" rx="14" fill="#10162E" stroke="#F5C451" stroke-width="2"/>
  <text x="100.0" y="46.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#E8ECF8">mail_send</text>
  <text x="100.0" y="70.0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9AA4C7">from any agent</text>
</g>
<g transform="translate(300,200)">
  <rect width="230" height="100" rx="14" fill="#10162E" stroke="#F5C451" stroke-width="2"/>
